name: ci

on:
  pull_request:
    # "labeled"/"unlabeled" are included in addition to the defaults so that
    # adding or removing the "breaking" label (used by the mirror-compat job
    # below) re-evaluates the check without requiring a new commit.
    types: [ opened, synchronize, reopened, labeled, unlabeled ]

jobs:
  ci:
    strategy:
      matrix:
        go-version: [ 1.21.3 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        shell: bash
        run: |
          PATH=$PWD/misc/wasm:$PATH GOOS=js GOARCH=wasm go test ./...

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build examples
        shell: bash
        run: make build-examples

  mirror-compat:
    name: Mirror compatibility check
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required so that origin/<base_ref> is available
      # locally for the `git worktree add` step below.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate mirror forwarders from PR head
        run: |
          ./scripts/genforward.sh -out /tmp/mirror-head -version v0.0.0-head -replace "$GITHUB_WORKSPACE"

      - name: go mod tidy (generated mirror, head)
        working-directory: /tmp/mirror-head
        run: |
          # genforward only writes `go.mod` (require + replace); it does not
          # run `go mod tidy`. The generated go.mod's `replace` directive
          # points at the PR head checkout ($GITHUB_WORKSPACE) on local
          # disk, so tidying this module needs no network access even
          # though GOFLAGS=-mod=mod is required to let `go mod tidy` add
          # missing go.sum entries for that replaced module.
          GOFLAGS=-mod=mod go mod tidy

      - name: Build and vet generated mirror (head)
        working-directory: /tmp/mirror-head
        run: |
          GOOS=js GOARCH=wasm go build ./...
          GOOS=js GOARCH=wasm go vet ./...

      - name: Run mirror smoke tests
        run: bash mirror-tests/run.sh

      # We compare the workers-go *source* trees of the PR's base and head,
      # not the generated mirror trees: the mirror consists entirely of
      # transparent forwarders (`type T = src.T`, `var F = src.F`), whose
      # declared type never changes even when the underlying source
      # symbol's signature, method set, or struct fields do. Diffing the
      # mirror's exported API only catches whole-symbol add/remove, so
      # scripts/apidiff.sh diffs the source trees with
      # golang.org/x/exp/cmd/apidiff instead.
      #
      # apidiff's `-m` mode resolves module arguments as module paths
      # through the *current* module's build graph, not as arbitrary
      # directories: two independent trees that declare the same module
      # path (as the base and head checkouts of workers-go both do) cannot
      # be loaded together, so `apidiff -m /tmp/base "$GITHUB_WORKSPACE"`
      # fails with "directory prefix ... does not contain main module or
      # its selected dependencies" (verified locally). scripts/apidiff.sh
      # works around this with apidiff's export-file mode: it writes each
      # tree's exported API to a file (`apidiff -m -w FILE MODULE`, run
      # with cwd inside that tree) and then compares the two files, never
      # loading both trees at once.
      #
      # Exit codes: 0 no incompatible changes, 1 incompatible changes
      # found, 3 the base and head trees declare different module paths
      # (not comparable; this happens exactly once, at the workers ->
      # workers-go module rename).
      - name: Compare exported API (base vs head)
        id: apidiff
        run: |
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          set +e
          bash scripts/apidiff.sh /tmp/base "$GITHUB_WORKSPACE"
          code=$?
          set -e
          case "$code" in
            0) echo "breaking=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "breaking=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "::notice::Base and head declare different module paths; skipping the API diff for this PR."
              echo "breaking=false" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::scripts/apidiff.sh exited with unexpected code $code"; exit 1 ;;
          esac

      # tagpr's own release PRs (labeled "tagpr") normally carry no source
      # diff against main (versionFile = -), so they pass this check like
      # any other PR; no special-casing is needed beyond the "breaking"
      # label gate below.
      - name: Require "breaking" label for incompatible mirror changes
        if: steps.apidiff.outputs.breaking == 'true' && !contains(github.event.pull_request.labels.*.name, 'breaking')
        run: |
          echo "::error::This PR removes or changes exported symbols that the syumai/workers mirror forwards. Add the 'breaking' label to acknowledge that the mirror will drop/change these symbols on the next sync, or restore compatibility instead."
          exit 1

