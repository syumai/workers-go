package: kv
doc: |
  Package kv provides the Workers KV binding
  (https://developers.cloudflare.com/kv/).

  KVNamespace.get and .getWithMetadata are each overloaded on a "type"
  discriminant (a literal "text"/"json"/"arrayBuffer"/"stream" argument, or
  an options object carrying the same as its "type" field); cfgen only
  knows how to split on the plain literal-argument form, so this package
  exposes GetText/GetJSON/GetBytes/GetStream (and the WithMetadata
  variants) and drops the options-object overloads. The json variants
  return js.Value rather than a decoded value, since the JSON shape is
  caller-defined (KVNamespace<Key>'s "get<ExpectedValue>(..., "json")"
  generic has no default to map to a concrete Go type).
include:
  - KVNamespace
  - KVNamespaceGetOptions
  - KVNamespacePutOptions
  - KVNamespaceListOptions
  - KVNamespaceListResult
  - KVNamespaceListKey
  - KVNamespaceGetWithMetadataResult
bindings:
  - KVNamespace
types:
  # KVNamespaceGetOptions.type only exists to select which get() overload
  # applies; it's dropped (below) rather than represented as a field.
  KVNamespaceGetOptions.cacheTtl: "int"
  KVNamespacePutOptions.expiration: "int"
  KVNamespacePutOptions.expirationTtl: "int"
  # value is (string | ArrayBuffer | ArrayBufferView | ReadableStream); the
  # L2 kv package (which this is meant to be wrapped by) is responsible for
  # accepting a string/[]byte/io.Reader and producing the right JS value.
  KVNamespace.put.params.value: "js.Value"
overloads:
  KVNamespace.get:
    - { index: 1, name: GetText, literal: text }
    - { index: 2, name: GetJSON, literal: json }
    - { index: 3, name: GetBytes, literal: arrayBuffer }
    - { index: 4, name: GetStream, literal: stream }
  KVNamespace.getWithMetadata:
    - { index: 1, name: GetTextWithMetadata, literal: text }
    - { index: 2, name: GetJSONWithMetadata, literal: json }
    - { index: 3, name: GetBytesWithMetadata, literal: arrayBuffer }
    - { index: 4, name: GetStreamWithMetadata, literal: stream }
exclude:
  - KVNamespaceGetOptions.type
