package: kv
doc: |
  Package kv provides the Workers KV binding
  (https://developers.cloudflare.com/kv/).

  KVNamespace.get and .getWithMetadata are each overloaded on a "type"
  discriminant, either as a plain literal "text"/"json"/"arrayBuffer"/
  "stream" argument, or as an options object carrying the same value as
  its "type" field (KVNamespaceGetOptions<"text"> etc., needed to also
  pass cacheTtl). This package uses the options-object overloads, so it
  exposes GetText/GetJSON/GetBytes/GetStream (and the WithMetadata
  variants) each taking a KVNamespaceGetOptions; the caller (L2) is
  responsible for setting its Type field to the matching value. The json
  variants return js.Value rather than a decoded value, since the JSON
  shape is caller-defined (KVNamespace<Key>'s "get<ExpectedValue>(...,
  "json")" generic has no default to map to a concrete Go type).
include:
  - KVNamespace
  - KVNamespaceGetOptions
  - KVNamespacePutOptions
  - KVNamespaceListOptions
  - KVNamespaceListResult
  - KVNamespaceListKey
  - KVNamespaceGetWithMetadataResult
bindings:
  - KVNamespace
types:
  # KVNamespaceGetOptions.type has no default for its type parameter, so
  # cfgen would otherwise map it to js.Value; it's really just the same
  # "text"/"json"/"arrayBuffer"/"stream" discriminant as the plain-literal
  # get() overloads, so keep it a plain string that the caller (L2) fills
  # in per overload.
  KVNamespaceGetOptions.type: "string"
  KVNamespaceGetOptions.cacheTtl: "int"
  KVNamespacePutOptions.expiration: "int"
  KVNamespacePutOptions.expirationTtl: "int"
  # value is (string | ArrayBuffer | ArrayBufferView | ReadableStream); the
  # L2 kv package (which this is meant to be wrapped by) is responsible for
  # accepting a string/[]byte/io.Reader and producing the right JS value.
  KVNamespace.put.params.value: "js.Value"
overloads:
  # Indices 5-8 are the KVNamespaceGetOptions<"type"> overloads (the plain
  # literal-argument overloads at indices 1-4 don't carry cacheTtl).
  KVNamespace.get:
    - { index: 5, name: GetText }
    - { index: 6, name: GetJSON }
    - { index: 7, name: GetBytes }
    - { index: 8, name: GetStream }
  KVNamespace.getWithMetadata:
    - { index: 5, name: GetTextWithMetadata }
    - { index: 6, name: GetJSONWithMetadata }
    - { index: 7, name: GetBytesWithMetadata }
    - { index: 8, name: GetStreamWithMetadata }
